[project]
name = "intellifi"
version = "0.1.0"
description = "Polymarket market-integrity intelligence pipeline (vertical slice)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "eth-hash[pycryptodome]>=0.7",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Optional alternative compute engine for the maker-markout stage (scripts/44).
# PySpark 4.x requires Java 17 or 21. Install with: pip install -e '.[spark]'
spark = [
    "pyspark>=4.0,<4.1",
]
# NOTE: the optional Airflow orchestration layer (airflow/, docs/AIRFLOW.md) is deliberately
# NOT an extra here. Airflow pins an old pyarrow and would break the parquet store reads if
# installed into this venv; it gets its own isolated env via `bash airflow/setup.sh`.

[project.scripts]
intellifi = "intellifi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
